name: Compress and Deploy

# 触发条件：push 到 main 分支时自动执行压缩
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install terser
        run: npm install -g terser

      - name: Compress scripts.js to scripts.min.js
        run: terser scripts.js -o scripts.min.js --compress --mangle

      - name: Commit and push compressed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts.min.js
          if git diff --cached --quiet; then
            echo "scripts.min.js 无变化，跳过提交"
          else
            git commit -m "chore: auto-compress scripts.js [skip ci]"
            git push
            echo "已提交压缩后的 scripts.min.js"
          fi
